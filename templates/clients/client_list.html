<h1>Clients</h1>

<p>
    <a href="{% url 'client-create' %}">➕ Create client</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
    </tr>

    {% for client in clients %}
        <tr>
            <td>{{ client.name }}</td>
            <td>{{ client.email }}</td>
            <td>{{ client.phone }}</td>
            <td>
                <a href="{% url 'client-edit' client.id %}">Edit</a>
                |
                <a href="{% url 'client-delete' client.id %}">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr>
            <td colspan="4">No clients yet.</td>
        </tr>
    {% endfor %}
</table>

<p>
    <a href="{% url 'personal-dashboard' %}">← Back to dashboard</a>
</p>
